<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Error 404 - Página no encontrada</title>
</head>
<body class="bg-white font-sans antialiased">

<div class="min-h-screen flex flex-col items-center justify-center text-center px-6">
    <div class="relative mb-12">
        
        <img src="{{url_for('static', filename='img/404.png')}}" 
             alt="Página no encontrada" 
             class="relative z-10 max-w-xs md:max-w-md drop-shadow-2xl hover:scale-105 transition-transform duration-300">
    </div>

    <div class="max-w-2xl">
        <h1 class="text-7xl md:text-9xl font-black text-gray-900 tracking-tighter mb-2">
            404
        </h1>
        
        <h2 class="text-xl md:text-3xl font-bold text-orange-600 uppercase tracking-widest mb-6">
            ¡Oops! Página no encontrada
        </h2>
        
        <p class="text-gray-600 max-w-md mx-auto text-lg leading-relaxed mb-10">
            "Parece que la página que estás buscando no existe."
        </p>

        <a href="/" class="inline-block bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:-translate-y-1 active:scale-95">
            Volver al Inicio
        </a>
    </div>
</div>

</body>
</html>
