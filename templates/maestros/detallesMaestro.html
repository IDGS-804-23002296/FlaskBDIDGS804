{% extends "layout.html" %}
{% block container %}

<div class="max-w-md mx-auto mt-20 mb-10">
    <div class="relative bg-white border border-gray-200 rounded-3xl shadow-xl overflow-hidden">
        
        <div class="bg-indigo-600 h-24 w-full absolute top-0 left-0"></div>

        <div class="relative pt-10 px-6 pb-8">
            <div class="flex justify-center">
                <div class="p-1 bg-white rounded-full shadow-lg">
                    <img class="rounded-full w-28 h-28 border-4 border-white object-cover" 
                         src="https://ui-avatars.com/api/?name={{ nombre }}+{{ apellidos }}&background=4f46e5&color=fff&size=128" 
                         alt="Foto de {{ nombre }}" />
                </div>
            </div>

            <div class="text-center mt-4">
                <h2 class="text-2xl font-black text-heading tracking-tight uppercase">
                    {{ nombre }} {{ apellidos }}
                </h2>
                <span class="inline-block px-4 py-1 mt-2 text-[10px] font-bold bg-indigo-50 text-indigo-600 rounded-full uppercase tracking-[0.2em] border border-indigo-100">
                    Cuerpo Académico
                </span>
            </div>

            <div class="relative my-8 border-t-2 border-dashed border-gray-200">
                <div class="absolute -left-9 -top-3 w-6 h-6 bg-neutral-primary-soft rounded-full border border-gray-200"></div>
                <div class="absolute -right-9 -top-3 w-6 h-6 bg-neutral-primary-soft rounded-full border border-gray-200"></div>
            </div>

            <div class="space-y-4">
                <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                    <div class="p-2 bg-white rounded-lg shadow-sm text-indigo-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Especialidad</p>
                        <p class="text-sm font-bold text-heading">{{ especialidad }}</p>
                    </div>
                </div>

                <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                    <div class="p-2 bg-white rounded-lg shadow-sm text-indigo-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
                        </svg>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Contacto Institucional</p>
                        <p class="text-sm font-bold text-heading truncate">{{ email }}</p>
                    </div>
                </div>
            </div>

            <div class="mt-8">
                <a href="{{ url_for('maestros.index') }}" 
                   class="flex justify-center items-center w-full py-3.5 px-4 bg-gray-900 text-white font-bold rounded-xl hover:bg-orange-700 transition-all duration-300 shadow-lg group">
                    <svg class="w-5 h-5 me-2 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 8 8 0 01-18 0z" />
                    </svg>
                    Volver al Directorio
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
